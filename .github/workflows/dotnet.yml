# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: 
      - "main"
      - features/*
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore  -c Debug -f net8.0

    - name: List built test runtime outputs
      shell: pwsh
      run: |
        Get-ChildItem -Recurse 'MstTrx1/bin/Debug/net8.0' | ForEach-Object { Write-Host $_.FullName }
        Get-ChildItem -Recurse 'MstTrx2/bin/Debug/net8.0' | ForEach-Object { Write-Host $_.FullName }

    - name: Stage deterministic test artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path 'artifacts/MstTrx1' | Out-Null
        New-Item -ItemType Directory -Force -Path 'artifacts/MstTrx2' | Out-Null
        Copy-Item -Recurse -Force 'MstTrx1/bin/Debug/net8.0' 'artifacts/MstTrx1/'
        Copy-Item -Recurse -Force 'MstTrx2/bin/Debug/net8.0' 'artifacts/MstTrx2/'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: build-artifacts
        path: |
          artifacts/**
        retention-days: 1

  test:
    needs: build
    name: Test - ${{ matrix.test-suite.name }}
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      matrix:
        test-suite:
          - name: "Test 1"
            executable: "MstTrx1/net8.0/MstTrx1.exe"
            filterNamespace: "MstTrx1*"
          - name: "Test 2"
            executable: "MstTrx2/net8.0/MstTrx2.exe"
            filterNamespace: "MstTrx2*"

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts
        path: artifacts

    - name: List contents after download
      shell: pwsh
      run: |
        Get-ChildItem -Recurse 'artifacts' `
          | ForEach-Object { Write-Host $_.FullName }

    - name: Run tests from built artifact
      shell: pwsh
      run: |
        $exe = Join-Path $PWD "artifacts/${{ matrix.test-suite.executable }}"
        if (-not (Test-Path $exe)) {
          throw "Test executable not found: $exe"
        }
        & $exe --filter-namespace "${{ matrix.test-suite.filterNamespace }}"
